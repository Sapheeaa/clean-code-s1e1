
<!DOCTYPE html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
  <div class="page">
  <div class="image-section">
    <img src="./eisenhower-matrix.jpg" alt="scheme of eisenhower matrix">
    <a class="info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>
  <div class="todo-container">
    <p id="topSectionForAddingElementToList">
      <label for="new-task" class="task-label">Add Item</label>
    </p>
    <div class="task-row-wrapper">
      <input id="new-task"class="task-input" type="text">
      <button class="button-add">Add</button>
    </div>
    <h3 class="todo-title">Todo</h3>
    <ul id="incompleteTasks" class="task-list">
      <li class="task-item">
        <input type="checkbox"class="task-checkbox">
        <label class="task-text">Pay Bills</label>
        <input type="text" class="task-input">
        <button class="button-edit">Edit</button>
        <button class="button-delete">
          <img src="./remove.svg">
        </button>
      </li>
      <li class="task-item edit-mode">
        <input type="checkbox" class="task-checkbox">
        <label class="task-text">Go Shopping</label>
        <input type="text" class="task-input" value="Go Shopping">
        <button class="button-edit">Save</button>
        <button class="button-delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
    <h3 class="todo-title">Completed</h3>
    <ul id="completed-tasks" class="task-list">
      <li class="task-item">
        <input type="checkbox" class="task-checkbox" checked>
        <label class="task-text">See the Doctor</label>
        <input type="text" class="task-input">
        <button class="button-edit">Edit</button>
        <button class="button-delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
  </div>
<script src="app.js"></script>
</div>
</body>
</html>
